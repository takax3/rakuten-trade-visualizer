[project]
name = "rakuten-trade-visualizer"
version = "0.1.0"
description = "Visualize Rakuten Securities margin trade executions on 1-minute candlestick charts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
    "yfinance>=0.2.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
